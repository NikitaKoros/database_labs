services:
  db:
    image: postgres:16
    container_name: lab1_postgres
    environment:
      POSTGRES_DB: rental_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/DDL.sql:/docker-entrypoint-initdb.d/DDL.sql
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
