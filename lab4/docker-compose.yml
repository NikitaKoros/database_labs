services:
  db:
    image: postgres:16
    container_name: lab4_postgres
    environment:
      POSTGRES_DB: rental_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - ./scripts/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./scripts/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - pgdata_lab4:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_buffers=256MB
        -c work_mem=64MB
        -c max_parallel_workers_per_gather=0

volumes:
  pgdata_lab4:
